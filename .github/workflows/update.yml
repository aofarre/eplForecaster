name: Update EPL Forecast

on:
  schedule:
    # Run daily at 07:00 UTC during the EPL season (Aug–May)
    - cron: "0 7 * 8-12,1-5 *"
  workflow_dispatch:
    inputs:
      sims:
        description: "Monte Carlo simulations (default 10000)"
        required: false
        default: "10000"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the SQLite database from cache so we don't re-download
      # 30+ seasons of historical data on every run.
      - name: Restore DB cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/epl.db
          key: epl-db-history-v1

      - name: Load historical data (first run only)
        if: steps.cache-db.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          python cli.py init
          python cli.py load-history

      - name: Sync current season
        working-directory: src
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python cli.py sync

      - name: Fetch squad values
        working-directory: src
        run: python cli.py fetch-values

      - name: Run forecast and write data.json
        working-directory: src
        run: |
          SIMS=${{ github.event.inputs.sims || '10000' }}
          python cli.py forecast --sims $SIMS --output ../docs/data.json

      - name: Commit updated forecast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          # Only commit if something changed
          git diff --cached --quiet || \
            git commit -m "chore: update forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
